site_name: TreeForge
site_description: Turn filesystem directories and AI-generated folder structures into beautiful, customizable diagrams using Mermaid and Graphviz.
site_url: https://sergiogilborras.github.io/treeforge/
repo_url: https://github.com/SergioGilBorras/treeforge
repo_name: SergioGilBorras/treeforge
theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: indigo
    - scheme: slate
      primary: blue
      accent: cyan
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Gallery: examples/README.md
  - Rendering: rendering.md
  - File types: file-types.md
  - Icons: icons.md
  - Configuration: configuration.md
  - Developer validation: developer-validation.md
  - Print and size limits: size-guidance.md
  - Roadmap: roadmap.md
exclude_docs: |
  /README.md
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.superfences
