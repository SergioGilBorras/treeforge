name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python devtools/run_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python-version }}
          path: validation-output/
          if-no-files-found: ignore
      - run: python -m build
      - name: Smoke-test installed wheel
        run: python devtools/check_distribution.py
      - name: Verify wheel contains SVG assets
        run: python -c "import glob,zipfile; w=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert any(p.endswith('assets/icons/folder.svg') for p in w.namelist()); print('Bundled icons verified')"
