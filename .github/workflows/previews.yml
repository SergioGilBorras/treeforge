name: Regenerate preview SVGs
on:
  push:
    branches: [feat/initial-treeforge-package]
    paths:
      - 'src/treeforge/**'
      - 'devtools/generate_previews.py'
      - '.github/workflows/previews.yml'
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-treeforge-package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python devtools/generate_previews.py
      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/examples/*-plain.svg docs/examples/*-boxes.svg
          git diff --cached --quiet || (git commit -m "docs: regenerate SVG previews using TreeForge" && git push)
